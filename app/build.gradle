plugins { id 'com.android.application' }

// remove.bg key: GitHub Secret (REMOVEBG_KEY) থেকে, না থাকলে -PREMOVEBG_KEY=... থেকে, না হলে খালি
def removeBgKey = System.getenv('REMOVEBG_KEY') ?: (project.findProperty('REMOVEBG_KEY') ?: '')

android {
    namespace 'com.example.converter'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.converter'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'REMOVEBG_KEY', "\"${removeBgKey.trim()}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // পাসপোর্ট ট্যাবের অফলাইন ব্যাকগ্রাউন্ড রিমুভ (মডেল অ্যাপের ভেতরেই থাকে)
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta5'
}
